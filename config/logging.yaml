version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  json:
    class: "pythonjsonlogger.jsonlogger.JsonFormatter"
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"

handlers:
  console:
    class: "logging.StreamHandler"
    level: "DEBUG"
    formatter: "standard"
    stream: "ext://sys.stdout"
  
  file:
    class: "logging.handlers.RotatingFileHandler"
    level: "INFO"
    formatter: "detailed"
    filename: "logs/app.log"
    maxBytes: 10485760  # 10MB
    backupCount: 5
  
  error_file:
    class: "logging.handlers.RotatingFileHandler"
    level: "ERROR"
    formatter: "detailed"
    filename: "logs/errors.log"
    maxBytes: 10485760  # 10MB
    backupCount: 5

loggers:
  __main__:
    level: "DEBUG"
    handlers: ["console", "file"]
    propagate: false
  
  camera:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false
  
  pose:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false
  
  segmentation:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false
  
  saree:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false
  
  renderer:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false
  
  database:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false

root:
  level: "INFO"
  handlers: ["console", "file", "error_file"]
